<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Natural Gecko Crawl Preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8c59d;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #label{position:fixed;left:18px;top:16px;padding:9px 13px;border-radius:999px;background:#18342ddd;color:#f4e6c7;font-weight:800;letter-spacing:.05em}
    #note{position:fixed;left:18px;bottom:16px;padding:8px 12px;border-radius:10px;background:#efe2c8dd;color:#25342e;font-size:14px}
  </style>
</head>
<body>
  <div id="label">SKIN-GROUNDED GECKO · PREVIEW 13</div>
  <div id="note">Original limbs preserved · rendered lowest toe grounded</div>
  <script src="three-r128-build55.js"></script>
  <script src="GLTFLoader.js"></script>
  <script>
  (()=>{
    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0xb8c59d);
    scene.fog=new THREE.Fog(0xb8c59d,12,28);
    const camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.05,80);
    camera.position.set(11,6.2,16.5);camera.lookAt(0,.65,0);
    const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
    renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xfff3d5,0x526947,1.2));
    const sun=new THREE.DirectionalLight(0xffe8bf,1.35);sun.position.set(5,9,6);sun.castShadow=true;scene.add(sun);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,25),new THREE.MeshStandardMaterial({color:0x78955b,roughness:1}));
    ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    const path=new THREE.Mesh(new THREE.PlaneGeometry(22,3.5),new THREE.MeshStandardMaterial({color:0xbca77c,roughness:1}));
    path.rotation.x=-Math.PI/2;path.position.y=.006;scene.add(path);

    let actor=null,actorBaseY=.02,bones={},rest={},restPos={},footRest={},travelDir=new THREE.Vector3(0,0,1),skinned=[],mixer=null,sourceClip=null,ready=false;
    const names=['Bone_01','Bone.001_02','Bone.002_03','Bone.002_end_04','Bone.003_015','Bone.012_017','ArmF.L_05','ArmF2.L_06','ArmF3.L_07','ArmF4.L_08','ArmF.R_010','ArmF2.R_011','ArmF3.R_012','ArmF4.R_013','Bone.019_024','Bone.020_025','Bone.021_026','Bone.022_027','Bone.023_029','Bone.024_030','Bone.025_031','Bone.026_032','Bone.013_018','Bone.014_00','Bone.015_019','Bone.016_020','Bone.017_021','Bone.018_022'];
    const rot=(name,axis,value)=>{const b=bones[name];if(b)b['rotate'+axis](value)};
    const chains={
      fl:{j:['ArmF4.L_08','ArmF3.L_07','ArmF2.L_06','ArmF.L_05'],e:'ArmF4.L_end_09',phase:0},
      fr:{j:['ArmF4.R_013','ArmF3.R_012','ArmF2.R_011','ArmF.R_010'],e:'ArmF4.R_end_014',phase:Math.PI},
      hl:{j:['Bone.022_027','Bone.021_026','Bone.020_025','Bone.019_024'],e:'Bone.022_end_028',phase:Math.PI},
      hr:{j:['Bone.026_032','Bone.025_031','Bone.024_030','Bone.023_029'],e:'Bone.026_end_033',phase:0}
    };
    function reset(){for(const name of names){if(bones[name]&&rest[name])bones[name].quaternion.copy(rest[name]);if(bones[name]&&restPos[name])bones[name].position.copy(restPos[name]);}}
    function solveFoot(chain,target){
      const eff=bones[chain.e];if(!eff)return;
      const jp=new THREE.Vector3(),ep=new THREE.Vector3(),qParent=new THREE.Quaternion(),qWorld=new THREE.Quaternion();
      const from=new THREE.Vector3(),to=new THREE.Vector3(),delta=new THREE.Quaternion(),invParent=new THREE.Quaternion();
      for(let pass=0;pass<3;pass++)for(const name of chain.j){
        const joint=bones[name];if(!joint)continue;
        actor.updateMatrixWorld(true);joint.getWorldPosition(jp);eff.getWorldPosition(ep);
        from.copy(ep).sub(jp);to.copy(target).sub(jp);if(from.lengthSq()<1e-8||to.lengthSq()<1e-8)continue;
        from.normalize();to.normalize();delta.setFromUnitVectors(from,to);
        joint.getWorldQuaternion(qWorld);joint.parent.getWorldQuaternion(qParent);invParent.copy(qParent).invert();
        qWorld.premultiply(delta);joint.quaternion.copy(invParent.multiply(qWorld)).normalize();
      }
    }
    function levelSpine(t){
      for(const name of ['Bone_01','Bone.001_02','Bone.002_03','Bone.002_end_04']){
        const bone=bones[name];if(!bone)continue;
        if(rest[name])bone.quaternion.copy(rest[name]);
        if(restPos[name])bone.position.copy(restPos[name]);
      }
      // Remove the authored upward neck curve, then angle the whole upper chain
      // slightly downward so the visible mesh follows the pelvis line.
      bones['Bone.001_02']?.quaternion.identity();
      bones['Bone.002_03']?.quaternion.identity();
      bones['Bone_01']?.rotateZ(.16);
      bones['Bone.002_03']?.rotateY(Math.sin(t*4.8)*.035);
    }
    function plantFeet(t){
      if(!actor)return;
      actor.position.y=actorBaseY;
      actor.updateMatrixWorld(true);
      const belly=new THREE.Vector3();
      (bones['Bone_01']||bones['Bone.012_017'])?.getWorldPosition(belly);
      actor.position.y+=.18-belly.y;
      actor.updateMatrixWorld(true);
      if(!Object.keys(footRest).length){
        for(const [key,chain] of Object.entries(chains)){
          const foot=bones[chain.e],p=new THREE.Vector3();
          if(foot){foot.getWorldPosition(p);p.y=-.015;footRest[key]=p;}
        }
        const head=new THREE.Vector3(),tail=new THREE.Vector3();
        bones['Bone.002_end_04']?.getWorldPosition(head);
        (bones['Bone.018_end_023']||bones['Bone.018_022'])?.getWorldPosition(tail);
        travelDir.copy(head.sub(tail)).setY(0).normalize();
      }
      const lateral=new THREE.Vector3(-travelDir.z,0,travelDir.x),p=t*5.4;
      for(const [key,chain] of Object.entries(chains)){
        if(!footRest[key])continue;
        const wave=Math.sin(p+chain.phase),lift=Math.max(0,wave);
        const target=footRest[key].clone()
          .addScaledVector(travelDir,wave*.20)
          .addScaledVector(lateral,(key.endsWith('l')?1:-1)*.23);
        target.y=-.015+lift*.13;
        solveFoot(chain,target);
      }
    }
    function groundRenderedSkin(){
      if(!actor||!skinned.length)return;
      actor.position.y=actorBaseY;
      actor.updateMatrixWorld(true);
      const v=new THREE.Vector3();let minY=Infinity;
      for(const mesh of skinned){
        mesh.skeleton.update();
        const pos=mesh.geometry.attributes.position;
        const step=Math.max(1,Math.floor(pos.count/4200));
        for(let i=0;i<pos.count;i+=step){
          mesh.boneTransform(i,v);v.applyMatrix4(mesh.matrixWorld);
          if(v.y<minY)minY=v.y;
        }
      }
      if(Number.isFinite(minY))actor.position.y+=.018-minY;
      actor.updateMatrixWorld(true);
    }
    function pose(t){
      if(!ready)return;reset();const p=t*4.6;
      actor.position.y=actorBaseY;
      actor.rotation.y=-.48;
      actor.updateMatrixWorld(true);
      for(const [key,chain] of Object.entries(chains)){
        const phase=p+chain.phase,swing=Math.sin(phase),lift=Math.max(0,Math.cos(phase));
        const target=footRest[key].clone().addScaledVector(travelDir,swing*.34);target.y+=lift*.24;
        solveFoot(chain,target);
      }
      ['Bone.013_018','Bone.014_00','Bone.015_019','Bone.016_020','Bone.017_021','Bone.018_022'].forEach((n,i)=>rot(n,'Y',Math.sin(p-i*.48)*(.07-i*.006)));
    }
    function renderAt(t){
      if(mixer&&sourceClip)mixer.setTime(t%sourceClip.duration);
      levelSpine(t);
      groundRenderedSkin();
      renderer.render(scene,camera);
    }
    window.setPreviewTime=t=>renderAt(t);
    fetch('assets87/gecko.json').then(r=>r.json()).then(async packed=>{
      const raw=atob(packed.data),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const buffer=await new Response(stream).arrayBuffer();
      new THREE.GLTFLoader().parse(buffer,'',asset=>{
        const model=asset.scene;model.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());
        const scale=3.4/Math.max(size.y,.001);model.scale.multiplyScalar(scale);
        model.position.sub(new THREE.Vector3((box.min.x+box.max.x)/2,box.min.y,(box.min.z+box.max.z)/2).multiplyScalar(scale));
        // Keep ground-facing yaw and the asset's lay-flat correction on separate
        // parents. Combining them in one XYZ Euler made the animal stand tilted.
        actor=new THREE.Group();actor.rotation.y=-.98;
        const layFlat=new THREE.Group();layFlat.rotation.x=Math.PI/2;layFlat.add(model);
        actor.add(layFlat);scene.add(actor);
        actor.updateMatrixWorld(true);
        const laidBox=new THREE.Box3().setFromObject(actor),laidCenter=laidBox.getCenter(new THREE.Vector3());
        actor.position.x=-laidCenter.x;actor.position.z=-laidCenter.z;actorBaseY=.035-laidBox.min.y-.10;actor.position.y=actorBaseY;
        model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.isSkinnedMesh)skinned.push(o);}if(o.isBone){bones[o.name]=o;rest[o.name]=o.quaternion.clone();restPos[o.name]=o.position.clone();}});
        sourceClip=asset.animations[2];
        mixer=new THREE.AnimationMixer(model);
        mixer.clipAction(sourceClip).reset().setLoop(THREE.LoopRepeat,Infinity).play();
        ready=true;window.previewReady=true;renderAt(0);
      });
    });
    let start=performance.now();function loop(now){if(!window.captureMode)renderAt((now-start)/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  })();
  </script>
</body>
</html>
