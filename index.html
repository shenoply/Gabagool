<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wet Whiskers</title>
<style>
  :root{
    --ink:#2b1d14; --paper:#e9dcc3; --moss:#5f7a4b; --brick:#a4432b; --puddle:#3e6b7a; --ochre:#d9a441;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;background:var(--ink);font-family:Georgia,"Times New Roman",serif;color:var(--paper)}
  #c{display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none}
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(43,29,20,.92);pointer-events:auto;text-align:center;padding:24px}
  #title h1{font-size:clamp(40px,9vw,88px);font-weight:400;letter-spacing:-.02em;line-height:.95}
  #title p{max-width:34ch;font-size:17px;line-height:1.5;opacity:.85}
  .btn{pointer-events:auto;background:var(--ochre);color:var(--ink);border:0;font:inherit;font-size:18px;padding:12px 26px;border-radius:999px;cursor:pointer}
  .slot{border-radius:999px !important}
  .btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
  #sub{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);font-size:clamp(18px,3vw,26px);text-shadow:0 2px 6px #000;max-width:90vw;text-align:center;opacity:0;transition:opacity .4s}
  #hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;font-size:16px}
  #hud span{background:rgba(43,29,20,.7);padding:6px 12px;border-radius:8px}
  #prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:var(--ochre);color:var(--ink);padding:8px 16px;border-radius:8px;font-size:17px;display:none}
  #skip{position:absolute;right:14px;bottom:14px;font-size:14px;padding:8px 14px;background:rgba(233,220,195,.2);color:var(--paper)}
  #go{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none}
  #hb{position:absolute;left:0;right:0;top:56px;display:none;flex-direction:column;gap:6px;padding:8px 12px;background:rgba(43,29,20,.86);pointer-events:auto}
  #htabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:rgba(233,220,195,.15);color:var(--paper);border:0;font:inherit;font-size:14px;padding:6px 12px;border-radius:999px}
  .tab.on{background:var(--ochre);color:var(--ink)}
  #hout{margin-left:auto;background:rgba(95,122,75,.7)}
  #hlist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  #hplace{display:none;gap:8px;align-items:center;flex-wrap:wrap}
  #hplace .btn{font-size:14px;padding:8px 14px}
  #hsel{flex:1 1 100%;font-size:15px}
  .hint{opacity:.7;padding:8px;font-size:14px}
  #hplacebtn:disabled{opacity:.5}
  .slot{flex:0 0 auto;min-width:96px;background:var(--paper);color:var(--ink);border:3px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left}
  .slot small{display:block;opacity:.7;font-size:12px}
  .slot.sel{border-color:var(--ochre)}
  .slot.used{opacity:.4}
  #buildbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
  #done{padding:8px 18px;font-size:15px}
  #pad{position:absolute;left:0;right:0;bottom:18px;display:none;justify-content:space-between;align-items:flex-end;padding:0 22px;pointer-events:none}
  #stick{width:130px;height:130px;border-radius:50%;background:rgba(233,220,195,.16);border:2px solid rgba(233,220,195,.35);position:relative;pointer-events:auto;touch-action:none}
  #knob{width:56px;height:56px;border-radius:50%;background:var(--paper);position:absolute;left:35px;top:35px;opacity:.9}
  #pad .g{width:78px;height:78px;border-radius:50%;border:0;background:var(--ochre);color:var(--ink);font:inherit;font-size:16px;pointer-events:auto;touch-action:none}
  #acts{display:grid;grid-template-columns:56px 78px;grid-template-rows:56px 56px;gap:8px;align-items:end;justify-items:end}
  #acts .s{width:56px;height:56px;border-radius:50%;border:0;background:rgba(233,220,195,.28);color:var(--paper);font:inherit;font-size:13px;pointer-events:auto;touch-action:none}
  #padB{grid-column:1;grid-row:1}#padR{grid-column:2;grid-row:1;justify-self:start}#padJ{grid-column:1;grid-row:2}#padE{grid-column:2;grid-row:2}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(30,16,8,.55) 100%);pointer-events:none}
  #talk{position:absolute;left:12px;right:12px;bottom:22%;background:rgba(43,29,20,.92);border:2px solid var(--ochre);border-radius:14px;padding:12px 16px 10px;display:none;pointer-events:auto}
  #tname{color:var(--ochre);font-size:14px;margin-bottom:4px}
  #ttext{font-size:19px;line-height:1.35;min-height:2.7em}
  #tnext{font-size:12px;opacity:.6;text-align:right;margin-top:6px}
  #radioui{position:absolute;left:12px;right:12px;bottom:24%;background:rgba(43,29,20,.94);border:2px solid var(--ochre);border-radius:14px;padding:12px 14px;display:none;pointer-events:auto}
  #rtitle{color:var(--ochre);font-size:14px}#rnow{font-size:17px;margin:4px 0 8px}.rrow{display:flex;gap:6px;flex-wrap:wrap}.rrow .btn{font-size:13px;padding:8px 12px}
  #end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(43,29,20,.85);text-align:center;padding:24px;pointer-events:auto}
  #end h2{font-size:clamp(32px,6vw,60px);font-weight:400}
  @media (prefers-reduced-motion:reduce){#sub{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="vig"></div>
  <div id="talk"><div id="tname"></div><div id="ttext"></div><div id="tnext">tap to skip</div></div>
  <div id="title">
    <h1>Wet Whiskers</h1>
    <p>The river came up in the night and Pip's home went under. Everything's in the dumpster now — go and get it back.</p>
    <button class="btn" id="start">Start</button>
    <button class="btn" id="newgame" style="background:rgba(233,220,195,.2);color:var(--paper);font-size:14px">New game (wipe save)</button>
    <p style="font-size:13px;opacity:.6">WASD move · Shift run · Space jump · Q roll · F bite · E grab · R rotate</p>
    <p style="font-size:11px;opacity:.45">Neighbour model: "The Fat Rat" by Ryan Honey (CC-BY 4.0) · build 25</p>
  </div>
  <div id="sub"></div>
  <div id="hud"><span id="phase"></span><span id="bag"></span></div>
  <button class="btn" id="mute" style="position:absolute;top:56px;right:14px;font-size:13px;padding:6px 12px;background:rgba(43,29,20,.7);color:var(--paper)">Sound: on</button>
  <div id="prompt"></div>
  <button class="btn" id="skip" style="display:none">Skip scene</button>
  <button class="btn" id="go">Head home and rebuild</button>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <div id="acts"><button class="s" id="padB">Bite</button><button class="s" id="padR">Roll</button><button class="s" id="padJ">Jump</button><button class="g" id="padE">Grab</button></div>
  </div>
  <div id="hb">
    <div id="htabs"></div>
    <div id="hlist"></div>
    <div id="hplace"><span id="hsel"></span><button class="btn" id="hrot">Rotate</button><button class="btn" id="hplacebtn">Place</button><button class="btn" id="hcancel" style="background:rgba(233,220,195,.25);color:var(--paper)">Cancel</button></div>
  </div>
  <div id="radioui">
    <div id="rtitle">Radio</div>
    <div id="rnow">Radio off</div>
    <div class="rrow"><button class="btn" id="rplay">Play</button><button class="btn" id="rnext" style="background:rgba(233,220,195,.25);color:var(--paper)">Next</button><label class="btn" style="background:rgba(233,220,195,.25);color:var(--paper)">Load songs from phone<input id="rfile" type="file" accept="audio/*" multiple style="display:none"></label><button class="btn" id="rclose" style="background:rgba(233,220,195,.25);color:var(--paper)">Close</button></div>
    <div id="rlist" style="font-size:12px;opacity:.7"></div>
  </div>
  <div id="end"><h2 id="endh"></h2><p id="endp"></p><button class="btn" id="again">Play again</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="GLTFLoader.js" onerror="console.warn('GLTFLoader unavailable')"></script>
<script>
// ---------- setup ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b1d14);
scene.fog=new THREE.Fog(0x4a2c1e,30,70);
const camera=new THREE.PerspectiveCamera(50,1,0.1,200);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(0xffd9a8,0x4a2818,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffc98f,0.78);sun.position.set(10,18,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:60});sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
scene.add(new THREE.AmbientLight(0xffc9a0,0.18));const rim=new THREE.DirectionalLight(0x9fd0ff,0.45);rim.position.set(-8,10,-12);scene.add(rim);
scene.background=new THREE.Color(0x4a2c1e);

// three-tone gradient for cel shading
const gradTex=(()=>{const c=document.createElement('canvas');c.width=4;c.height=1;const x=c.getContext('2d');
  ['#454040','#7e7672','#b3aaa2','#cfc6bd'].forEach((col,i)=>{x.fillStyle=col;x.fillRect(i,0,1,1);});
  const t=new THREE.CanvasTexture(c);t.minFilter=t.magFilter=THREE.NearestFilter;return t;})();

// painted textures, drawn once
const TEX={};
function paint(kind,size=256){
  if(TEX[kind])return TEX[kind];
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const R=(a,b)=>a+Math.random()*(b-a);
  const blot=(n,col,al,rmin,rmax)=>{x.globalAlpha=al;x.fillStyle=col;for(let i=0;i<n;i++){const bx=R(0,size),by=R(0,size),r1=R(rmin,rmax),r2=R(rmin,rmax),ro=R(0,6);for(const ox of [-size,0,size])for(const oy of [-size,0,size]){x.beginPath();x.ellipse(bx+ox,by+oy,r1,r2,ro,0,7);x.fill();}}x.globalAlpha=1;};
  if(kind==='wood'){x.fillStyle='#b8834f';x.fillRect(0,0,size,size);blot(60,'#8f5e33',.25,10,40);blot(40,'#d9a36c',.25,10,40);
    for(let i=0;i<6;i++){const y=i*size/6;x.fillStyle='#6e4426';x.fillRect(0,y,size,3);x.globalAlpha=.35;x.strokeStyle='#7a4b2a';x.lineWidth=2;for(let k=0;k<4;k++){x.beginPath();const yy=y+R(6,size/6-6);x.moveTo(0,yy);x.bezierCurveTo(size*.3,yy+R(-6,6),size*.6,yy+R(-6,6),size,yy);x.stroke();}x.globalAlpha=1;}}
  else if(kind==='plaster'){x.fillStyle='#e6cfa6';x.fillRect(0,0,size,size);blot(70,'#d7b98a',.35,14,50);blot(40,'#f3e2c2',.3,14,50);blot(25,'#c9a071',.2,20,70);}
  else if(kind==='brick'){x.fillStyle='#6f4a3c';x.fillRect(0,0,size,size);const bh=size/8,bw=size/4;
    for(let r=0;r<8;r++)for(let cI=-1;cI<5;cI++){const off=r%2?bw/2:0;x.fillStyle=['#a4533a','#994b34','#b05e44','#8f4530'][Math.floor(R(0,4))];x.fillRect(cI*bw+off+3,r*bh+3,bw-6,bh-6);}
    blot(60,'#5a3a2e',.25,6,24);blot(30,'#c97a5c',.15,6,20);}
  else if(kind==='asphalt'){x.fillStyle='#6b615a';x.fillRect(0,0,size,size);blot(120,'#5a514b',.3,6,26);blot(70,'#7a6f66',.25,6,26);blot(50,'#4a423d',.25,2,7);
    x.strokeStyle='#3d3632';x.globalAlpha=.5;x.lineWidth=1.5;for(let i=0;i<3;i++){x.beginPath();let px=R(0,size),py=R(0,size);x.moveTo(px,py);for(let k=0;k<5;k++){px+=R(-22,22);py+=R(-22,22);x.lineTo(px,py);}x.stroke();}x.globalAlpha=1;}
  else if(kind==='cobble'){x.fillStyle='#4e463f';x.fillRect(0,0,size,size);const cw=size/6,ch=size/6;
    for(let r=0;r<6;r++)for(let cI=-1;cI<7;cI++){const px=cI*cw+(r%2?cw/2:0),py=r*ch;x.fillStyle=['#8c7d6e','#806f61','#988a78','#76685c','#a08f7a'][Math.floor(R(0,5))];
      x.beginPath();const rr=9,w=cw-6,h=ch-6,X=px+3,Y=py+3;x.moveTo(X+rr,Y);x.arcTo(X+w,Y,X+w,Y+h,rr);x.arcTo(X+w,Y+h,X,Y+h,rr);x.arcTo(X,Y+h,X,Y,rr);x.arcTo(X,Y,X+w,Y,rr);x.fill();
      x.globalAlpha=.25;x.fillStyle='#fff';x.beginPath();x.ellipse(X+w*.4,Y+h*.35,w*.22,h*.16,0,0,7);x.fill();x.globalAlpha=1;}
    blot(50,'#3c3530',.3,3,12);blot(35,'#b4a48c',.18,3,10);}
  else if(kind==='steel'){x.fillStyle='#3c6b7c';x.fillRect(0,0,size,size);blot(60,'#34606f',.35,10,50);blot(40,'#4b7f90',.3,10,50);blot(18,'#8a4a2a',.45,4,16);blot(26,'#6b3a22',.35,2,8);
    x.globalAlpha=.35;x.fillStyle='#7a3f22';for(let i=0;i<8;i++){const rx=R(0,size),ry=R(0,size*.5);x.fillRect(rx,ry,R(2,5),R(30,110));}x.globalAlpha=1;
    x.fillStyle='#22393f';for(let i=0;i<48;i++){x.beginPath();x.arc(R(0,size),R(0,size),2.2,0,7);x.fill();}}
  else if(kind==='stripes'){x.fillStyle='#efe0c6';x.fillRect(0,0,size,size);x.fillStyle='#c98b7a';for(let i=0;i<size;i+=size/4)x.fillRect(i,0,size/8,size);blot(30,'#e0c9a8',.25,8,30);}
  else if(kind==='metal'){x.fillStyle='#3f7a5a';x.fillRect(0,0,size,size);blot(50,'#356649',.35,10,50);blot(30,'#4f8d6b',.3,10,50);blot(20,'#7a4b2a',.35,4,14);blot(12,'#2d4a3a',.5,3,8);}
  else if(kind==='cloth'){x.fillStyle='#d9a441';x.fillRect(0,0,size,size);blot(60,'#c48f2f',.3,6,20);blot(40,'#e8bb63',.3,6,20);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;TEX[kind]=t;return t;
}
const M=(c,o={})=>{const opt={color:c,gradientMap:gradTex};if(o.emissive){opt.emissive=o.emissive;opt.emissiveIntensity=o.emissiveIntensity||1;}if(o.transparent){opt.transparent=true;opt.opacity=o.opacity;}if(o.map){opt.map=o.map;}return new THREE.MeshToonMaterial(opt);};
const MT=(c,kind,rx=1,ry=1)=>{const t=paint(kind).clone();t.needsUpdate=true;t.repeat.set(rx,ry);return M(c,{map:t});};
const box=(w,h,d,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.castShadow=m.receiveShadow=true;return m};
const sph=(r,mat,ws=10,hs=8)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs),mat);m.castShadow=true;return m};
const cyl=(rt,rb,h,mat,s=12)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),mat);m.castShadow=m.receiveShadow=true;return m};

// ink outlines: inverted hull on every solid mesh
const inkMat=new THREE.MeshBasicMaterial({color:0x2b1d14,side:THREE.BackSide});
function outline(group){
  const list=[];group.traverse(o=>{if(o.isMesh&&!o.userData.ink&&!o.userData.noInk&&o.material!==inkMat){list.push(o);}});
  list.forEach(o=>{if(!o.geometry.boundingSphere)o.geometry.computeBoundingSphere();const r=o.geometry.boundingSphere.radius;if(r<0.06)return;if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();const bs=o.geometry.boundingBox.getSize(new THREE.Vector3());const mn=Math.min(bs.x,bs.y,bs.z),mx=Math.max(bs.x,bs.y,bs.z);if(mn/mx<0.12)return;
    const h=new THREE.Mesh(o.geometry,inkMat);h.userData.ink=true;const k=Math.min(0.08/Math.max(r,0.001),0.09)+1.0;
    h.scale.setScalar(k);o.add(h);o.userData.inked=true;});
}

// ---------- rat model (Pip v3: smooth lathe body, real face, spring tail) ----------
function makeRat(){
  const FUR=new THREE.Color(0x6e6a66),BACK=new THREE.Color(0x4a4643),BELLY=new THREE.Color(0xbdb5ab);
  const fur=M(0x6e6a66),pink=M(0xd39a95,{}),pinkD=M(0xb9757a),ink=M(0x120e0c),eyeW=M(0xf7f2ea),iris=M(0x3a2a1c),hl=M(0xffffff,{emissive:0xffffff,emissiveIntensity:.6});
  const vc=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:gradTex});
  const g=new THREE.Group();
  const hips=new THREE.Group();hips.position.set(0,0.74,0);g.add(hips);
  const torso=new THREE.Group();torso.rotation.x=-1.4;hips.add(torso);
  // one continuous body from rump to neck (lathe along local z)
  const prof=[[0,-0.42],[0.24,-0.38],[0.38,-0.25],[0.44,-0.05],[0.45,0.22],[0.42,0.5],[0.37,0.78],[0.3,1.0],[0.23,1.18],[0.15,1.3],[0.0,1.36]].map(([r,h])=>new THREE.Vector2(r,h));
  const bodyGeo=new THREE.LatheGeometry(prof,28);bodyGeo.rotateX(Math.PI/2);
  {const pos=bodyGeo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();
    for(let i=0;i<pos.count;i++){const y=pos.getY(i),z=pos.getZ(i);const t=THREE.MathUtils.clamp((y+0.12)/0.5,0,1);c.copy(BELLY).lerp(FUR,t);if(y>0.18)c.lerp(BACK,THREE.MathUtils.clamp((y-0.18)/0.25,0,1)*0.9);if(z<-0.2)c.lerp(BACK,0.15);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
    bodyGeo.setAttribute('color',new THREE.BufferAttribute(col,3));}
  const body=new THREE.Mesh(bodyGeo,vc);body.castShadow=body.receiveShadow=true;body.position.set(0,-0.02,0.15);torso.add(body);
  // head
  const head=new THREE.Group();head.position.set(0,0.06,1.36);head.rotation.x=1.25;head.scale.setScalar(1.15);torso.add(head);
  const skullGeo=new THREE.SphereGeometry(0.3,28,20);skullGeo.scale(1,0.92,1.05);
  {const pos=skullGeo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();for(let i=0;i<pos.count;i++){const y=pos.getY(i);const t=THREE.MathUtils.clamp((y+0.3)/0.45,0,1);c.copy(BELLY).lerp(FUR,t);if(y>0.1)c.lerp(BACK,0.5);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}skullGeo.setAttribute('color',new THREE.BufferAttribute(col,3));}
  const skull=new THREE.Mesh(skullGeo,vc);skull.castShadow=true;head.add(skull);
  const snProf=[[0.0,0],[0.14,0],[0.2,0.15],[0.25,0.32],[0.27,0.5]].map(([r,h])=>new THREE.Vector2(r,h)).reverse();
  const snGeo=new THREE.LatheGeometry(snProf,20);snGeo.rotateX(Math.PI/2);snGeo.rotateX(Math.PI);
  {const pos=snGeo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();for(let i=0;i<pos.count;i++){const y=pos.getY(i);const t=THREE.MathUtils.clamp((y+0.2)/0.35,0,1);c.copy(BELLY).lerp(FUR,t);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}snGeo.setAttribute('color',new THREE.BufferAttribute(col,3));}
  const snout=new THREE.Mesh(snGeo,vc);snout.castShadow=true;snout.position.set(0,-0.06,0.22);snout.scale.y=0.85;head.add(snout);
  const nose=sph(0.075,pinkD,12,10);nose.scale.set(1.15,0.85,0.9);nose.position.set(0,-0.02,0.74);head.add(nose);
  [-1,1].forEach(sx=>{const nz=sph(0.022,ink,6,6);nz.position.set(sx*0.04,-0.03,0.8);head.add(nz);});
  const teeth=box(0.07,0.06,0.02,eyeW);teeth.position.set(0,-0.11,0.62);head.add(teeth);
  // eyes: white, iris, pupil, highlight, lid
  const eyes=[],ears=[];
  [-1,1].forEach(sx=>{

  const u=g.userData={hips,torso,head,arms,legs,tail,ears,eyes,phase:0,sniff:0,act:null,air:false,vy:0,land:0,run:false,vel:0,

// ---------- rat house (used in cutscene and build) ----------
const HW=12,HD=9,DOORZ=2.2;
function makeHouse(state){
  const g=new THREE.Group();g.userData.parts={};
  const fl=FLOORS.find(f=>f.id===(state?state.floor:'wood'))||FLOORS[0];
  const wl=WALLS.find(w=>w.id===(state?state.wall:'plaster'))||WALLS[0];
  const floor=box(HW,0.2,HD,fl.mat());floor.position.y=-0.1;g.add(floor);g.userData.parts.floor=floor;
  const wallMat=wl.mat();
  const back=box(HW,3,0.2,wallMat);back.position.set(0,1.5,-HD/2);g.add(back);
  const right=box(0.2,3,HD,wallMat);right.position.set(HW/2,1.5,0);g.add(right);
  // left wall has the doorway gap at DOORZ (width 1.4)
  const lz1=(-HD/2+(DOORZ-0.7))/2, ll1=(DOORZ-0.7)+HD/2;const leftA=box(0.2,3,ll1,wallMat);leftA.position.set(-HW/2,1.5,lz1);g.add(leftA);
  const ll2=HD/2-(DOORZ+0.7);const leftB=box(0.2,3,ll2,wallMat);leftB.position.set(-HW/2,1.5,DOORZ+0.7+ll2/2);g.add(leftB);
  const lintel=box(0.2,0.6,1.4,wallMat);lintel.position.set(-HW/2,2.7,DOORZ);g.add(lintel);
  const skirt=box(HW,0.3,0.1,M(0x6e4c30));skirt.position.set(0,0.15,-HD/2+0.06);g.add(skirt);
  const win=box(1.8,1.3,0.1,M(0x8fb7c9,{emissive:0x3a5a6a,emissiveIntensity:.4}));win.position.set(2,1.8,-HD/2+0.05);g.add(win);
  const sill=box(2,0.08,0.3,M(0x6e4c30));sill.position.set(2,1.12,-HD/2+0.2);g.add(sill);
  g.userData.parts.walls=[back,right,leftA,leftB,lintel];
  [floor,back,right,leftA,leftB,lintel,skirt,win,sill].forEach(o=>o.userData.noInk=true);[back,right,leftA,leftB].forEach(o=>o.castShadow=false);
  if(state&&state.door){const d=CRAFT.door.build();d.position.set(-HW/2,0,DOORZ);g.add(d);g.userData.parts.door=d;}
  else{ // no door yet: a draught of rain blows in
    const gap=box(0.05,2.3,1.3,new THREE.MeshToonMaterial({color:0x223a44,gradientMap:gradTex,transparent:true,opacity:.5}));gap.position.set(-HW/2,1.15,DOORZ);gap.userData.noInk=true;g.add(gap);}
  return g;
}

// ---------- sound (all synthesised) ----------
const SFX={rain:null,stepT:0};
function sfxCtx(){const ac=audio();return ac&&voiceOn?ac:null;}
function noiseBuf(ac,len=1){const b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function burst(ac,{f=800,q=1,dur=0.08,vol=0.2,type='bandpass'}){const src=ac.createBufferSource();src.buffer=SFX.nb||(SFX.nb=noiseBuf(ac));const flt=ac.createBiquadFilter();flt.type=type;flt.frequency.value=f;flt.Q.value=q;const g=ac.createGain();const t=ac.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);src.connect(flt).connect(g).connect(ac.destination);src.start(t);src.stop(t+dur+0.02);}
function tone(ac,{f=440,f2=null,dur=0.15,vol=0.15,type='sine',delay=0}){const o=ac.createOscillator(),g=ac.createGain();const t=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+0.02);}
const sfx={
  step(surface){const ac=sfxCtx();if(!ac)return;if(surface==='cobble')burst(ac,{f:1800+Math.random()*600,q:2,dur:0.05,vol:0.08});else if(surface==='wood')burst(ac,{f:300+Math.random()*100,q:1.2,dur:0.07,vol:0.12,type:'lowpass'});else burst(ac,{f:900+Math.random()*300,q:6,dur:0.09,vol:0.07});},
  splash(){const ac=sfxCtx();if(!ac)return;burst(ac,{f:600,q:0.7,dur:0.25,vol:0.18,type:'lowpass'});},
  pickup(){const ac=sfxCtx();if(!ac)return;tone(ac,{f:660,f2:990,dur:0.12,vol:0.12});tone(ac,{f:990,f2:1320,dur:0.18,vol:0.1,delay:0.1});},
  place(){const ac=sfxCtx();if(!ac)return;burst(ac,{f:220,q:1,dur:0.12,vol:0.25,type:'lowpass'});tone(ac,{f:180,f2:120,dur:0.12,vol:0.1,type:'triangle'});},
  craft(){const ac=sfxCtx();if(!ac)return;[523,659,784].forEach((f,i)=>tone(ac,{f,dur:0.2,vol:0.1,delay:i*0.08,type:'triangle'}));},
  nope(){const ac=sfxCtx();if(!ac)return;tone(ac,{f:200,f2:150,dur:0.18,vol:0.12,type:'square'});},
  hiss(){const ac=sfxCtx();if(!ac)return;burst(ac,{f:3500,q:0.8,dur:0.7,vol:0.22,type:'highpass'});},
  yowl(){const ac=sfxCtx();if(!ac)return;tone(ac,{f:500,f2:900,dur:0.35,vol:0.16,type:'sawtooth'});tone(ac,{f:900,f2:400,dur:0.4,vol:0.14,type:'sawtooth',delay:0.3});},
  door(){const ac=sfxCtx();if(!ac)return;tone(ac,{f:120,f2:90,dur:0.35,vol:0.12,type:'sawtooth'});},
  rain(on){const ac=sfxCtx();if(!ac){if(SFX.rain){try{SFX.rain.stop();}catch(e){}SFX.rain=null;}return;}
    if(on&&!SFX.rain){const src=ac.createBufferSource();src.buffer=SFX.nb||(SFX.nb=noiseBuf(ac));src.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;const g=ac.createGain();g.gain.value=0.035;src.connect(f).connect(g).connect(ac.destination);src.start();SFX.rain=src;}
    if(!on&&SFX.rain){try{SFX.rain.stop();}catch(e){}SFX.rain=null;}}
};
function steps(dt,speed,surface){if(speed>0.05){SFX.stepT+=dt*speed;if(SFX.stepT>0.27){SFX.stepT=0;sfx.step(surface);}}else SFX.stepT=0.2;}

// ---------- radio ----------
const radio={on:false,tracks:[],idx:0,el:null,loopNodes:null,mode:'station'};
function radioStation(on){const ac=sfxCtx();if(!ac){return;}
  if(!on){if(radio.loopNodes){radio.loopNodes.forEach(n=>{try{n.stop();}catch(e){}});radio.loopNodes=null;}return;}
  if(radio.loopNodes)return;
  // original lo-fi loop, 4 bars at 84 bpm, scheduled 30s ahead then re-armed
  const bpm=84,beat=60/bpm,bar=beat*4;const nodes=[];const g=ac.createGain();g.gain.value=0.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;g.connect(lp).connect(ac.destination);
  const t0=ac.currentTime+0.05;
  const kick=(t)=>{const o=ac.createOscillator(),e=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);e.gain.setValueAtTime(0.5,t);e.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(e).connect(g);o.start(t);o.stop(t+0.3);nodes.push(o);};
  const snare=(t)=>{const src=ac.createBufferSource();src.buffer=SFX.nb||(SFX.nb=noiseBuf(ac));const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const e=ac.createGain();e.gain.setValueAtTime(0.18,t);e.gain.exponentialRampToValueAtTime(0.001,t+0.15);src.connect(f).connect(e).connect(g);src.start(t);src.stop(t+0.2);nodes.push(src);};
  const hat=(t)=>{const src=ac.createBufferSource();src.buffer=SFX.nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const e=ac.createGain();e.gain.setValueAtTime(0.06,t);e.gain.exponentialRampToValueAtTime(0.001,t+0.05);src.connect(f).connect(e).connect(g);src.start(t);src.stop(t+0.06);nodes.push(src);};
  const note=(f,t,d,vol,type='triangle',det=0)=>{const o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;o.detune.value=det;e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(vol,t+0.02);e.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(e).connect(g);o.start(t);o.stop(t+d+0.05);nodes.push(o);};
  const chords=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];const bass=[110,87.3,98,82.4];const mel=[440,523.3,493.9,440,392,440,329.6,392, 349.2,440,392,349.2,329.6,293.7,329.6,261.6];
  for(let rep=0;rep<8;rep++)for(let b=0;b<4;b++){const bt=t0+(rep*4+b)*bar;
    kick(bt);kick(bt+beat*2.5);snare(bt+beat);snare(bt+beat*3);for(let h=0;h<8;h++)hat(bt+h*beat/2);
    chords[b].forEach((f,i)=>{note(f,bt,bar*0.9,0.05,'sine',i*4);note(f*2,bt+beat*2,beat*1.6,0.03,'sine',-6);});
    note(bass[b],bt,beat*0.9,0.16,'sine');note(bass[b],bt+beat*1.5,beat*0.5,0.12,'sine');note(bass[b]*1.5,bt+beat*2.5,beat*0.5,0.1,'sine');
    for(let m=0;m<4;m++){const f=mel[(b*4+m+rep*2)%mel.length];if(Math.random()<0.75)note(f,bt+m*beat+(m%2?beat*0.1:0),beat*0.8,0.06,'triangle',Math.sin(bt+m)*8);}}
  radio.loopNodes=nodes;clearTimeout(radio.rearm);radio.rearm=setTimeout(()=>{if(radio.on&&radio.mode==='station'){radio.loopNodes=null;radioStation(true);}},32*bar*1000-500);}
function radioPlay(){radio.on=true;
  if(radio.tracks.length){radio.mode='tracks';radioStation(false);if(!radio.el){radio.el=new Audio();radio.el.addEventListener('ended',()=>{radio.idx=(radio.idx+1)%radio.tracks.length;radioPlay();});}
    radio.el.src=radio.tracks[radio.idx].url;radio.el.volume=0.7;radio.el.play().catch(()=>{});$('rnow').textContent='♪ '+radio.tracks[radio.idx].name;}
  else{radio.mode='station';radioStation(true);$('rnow').textContent='♪ Dumpster FM (built-in)';}
  $('rplay').textContent='Stop';}
function radioStop(){radio.on=false;radioStation(false);if(radio.el)radio.el.pause();$('rplay').textContent='Play';$('rnow').textContent='Radio off';}
function radioNext(){if(radio.tracks.length){radio.idx=(radio.idx+1)%radio.tracks.length;if(radio.on)radioPlay();}}
function bindRadio(){$('rplay').addEventListener('click',()=>radio.on?radioStop():radioPlay());$('rnext').addEventListener('click',radioNext);$('rclose').addEventListener('click',()=>{$('radioui').style.display='none';});
$('rfile').addEventListener('change',e=>{const files=[...e.target.files].filter(f=>/audio|mpeg|mp3|m4a|ogg|wav/i.test(f.type+f.name));
  radio.tracks=files.map(f=>({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));radio.idx=0;$('rlist').textContent=files.length?files.length+' song'+(files.length>1?'s':'')+' loaded from your phone (they stay on your device)':'';if(files.length)radioPlay();});}
function openRadio(){$('radioui').style.display='block';}

function makeCat(){
  const fur=M(0x2a2624,{}),furL=M(0x3d3633),pink=M(0xb9757a),eye=M(0xf6d34a,{emissive:0xf0c020,emissiveIntensity:1.4}),ink=M(0x0b0908);
  const g=new THREE.Group();
  const body=sph(0.9,fur,16,12);body.scale.set(1,0.85,2.2);body.position.y=1.15;g.add(body);
  const chest=sph(0.75,furL,14,10);chest.scale.set(0.9,0.8,1);chest.position.set(0,1.0,1.4);g.add(chest);
  const head=new THREE.Group();head.position.set(0,1.75,2.3);g.add(head);
  const skull=sph(0.62,fur,16,12);skull.scale.set(1,0.9,1);head.add(skull);
  const muz=sph(0.35,furL,12,8);muz.scale.set(1.1,0.7,0.9);muz.position.set(0,-0.15,0.5);head.add(muz);
  const nose=sph(0.09,pink,8,6);nose.position.set(0,-0.05,0.8);head.add(nose);
  [-1,1].forEach(sx=>{const ear=new THREE.Mesh(new THREE.ConeGeometry(0.22,0.5,4),fur);ear.castShadow=true;ear.position.set(sx*0.36,0.55,-0.05);ear.rotation.z=-sx*0.35;head.add(ear);
    const e=sph(0.13,eye,10,8);e.scale.set(1,1.3,0.6);e.position.set(sx*0.26,0.12,0.5);head.add(e);const pu=sph(0.05,ink,6,6);pu.scale.set(0.6,1.6,0.6);pu.position.set(sx*0.26,0.12,0.6);head.add(pu);
    for(let i=0;i<3;i++){const w=cyl(0.006,0.006,0.9,M(0xdddddd),4);w.rotation.z=Math.PI/2;w.rotation.y=sx*(0.3+i*0.25);w.position.set(sx*0.45,-0.1+i*0.05,0.6);head.add(w);}});
  const legs=[];[[-0.45,1.2],[0.45,1.2],[-0.5,-1.3],[0.5,-1.3]].forEach(([x,z])=>{const leg=new THREE.Group();leg.position.set(x,1.05,z);const th=cyl(0.2,0.14,0.7,fur,8);th.position.y=-0.35;const sh=cyl(0.13,0.11,0.5,fur,8);sh.position.y=-0.85;const paw=sph(0.17,furL,8,6);paw.scale.set(1,0.6,1.3);paw.position.set(0,-1.05,0.08);leg.add(th,sh,paw);g.add(leg);legs.push(leg);});
  const tail=[];let parent=g;for(let i=0;i<9;i++){const seg=new THREE.Group();seg.position.set(0,i?0:1.5,i?-0.32:-2.0);if(!i)seg.rotation.x=-0.9;const m=cyl(0.11-i*0.008,0.1-i*0.008,0.34,fur,8);m.rotation.x=Math.PI/2;m.position.z=-0.16;seg.add(m);parent.add(seg);parent=seg;tail.push(seg);}
  g.userData={head,legs,tail,phase:0};
  g.animate=function(dt,speed){const u=g.userData;u.phase+=dt*(speed>0.05?7:1.5)*(1+speed*0.6);const t=u.phase;
    if(speed>0.05){const ph=[0,Math.PI,Math.PI,0];u.legs.forEach((l,i)=>l.rotation.x=Math.sin(t+ph[i])*0.6);u.head.position.y=1.75+Math.sin(t*2)*0.04;u.head.rotation.x=0.05;}
    else{u.legs.forEach(l=>l.rotation.x*=0.85);u.head.rotation.y=Math.sin(t*0.5)*0.4;u.head.rotation.x=Math.sin(t*0.3)*0.1;}
    u.tail.forEach((sg,i)=>{if(i){sg.rotation.y=Math.sin(t*0.9+i*0.5)*0.25;sg.rotation.x=-0.12+Math.sin(t*0.6+i*0.4)*0.05;}});};
  return g;
}

// ---------- neighbour (The Fat Rat by Ryan Honey, CC-BY 4.0) ----------
let fatGltf=null,fatMixer=null;
function addNeighbour(){
  const place=(g)=>{
    const m=g.scene.clone();
    const bb=new THREE.Box3().setFromObject(m);const size=bb.getSize(new THREE.Vector3());const c=bb.getCenter(new THREE.Vector3());
    const k=3.6/size.y;m.scale.setScalar(k);
    m.position.set(-c.x*k,-bb.min.y*k,-c.z*k);
    const pivot=new THREE.Group();pivot.add(m);pivot.position.set(-4.4,0,1.0);pivot.rotation.y=1.3;
    m.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;const g=o.geometry;for(const k of Object.keys(g.attributes))if(!g.attributes[k])delete g.attributes[k];const old=o.material;o.material=new THREE.MeshToonMaterial({map:old.map||null,color:old.color||0xffffff,gradientMap:gradTex,transparent:old.transparent,opacity:old.opacity,alphaTest:old.alphaTest||0,side:old.side});}});
    root.add(pivot);
    if(g.animations.length){fatMixer=new THREE.AnimationMixer(m);const a=fatMixer.clipAction(g.animations[0]);a.play();}
  };
  if(fatGltf){place(fatGltf);return;}
  if(!THREE.GLTFLoader)return;
  new THREE.GLTFLoader().load('fat-rat.glb',g=>{fatGltf=g;if(phase==='scavenge')place(g);},undefined,()=>{});
}

const LINES=[[0,'Rain hammered the drainpipe all night.'],[3,'Pip slept through it. Rats do.'],[6,'Then the river remembered the cellar.'],[9.5,'Everything Pip owned floated out the door…'],[13,'…and ended up where everything ends up.'],[16,'']];
function tickCutscene(dt){
  cs.t+=dt;const T=cs.t;
  const idx=LINES.findIndex((l,i)=>T>=l[0]&&(!LINES[i+1]||T<LINES[i+1][0]));
  if(idx!==cs.line){cs.line=idx;ui.sub.style.opacity=0;clearTimeout(cs.subT);cs.subT=setTimeout(()=>{if(phase!=='cutscene')return;ui.sub.textContent=LINES[idx]?LINES[idx][1]:'';ui.sub.style.opacity=1;},350);}
  const level=T<6?-0.3:Math.min(1.6,-0.3+(T-6)*0.32);
  cs.water.position.y=level;
  const pos=cs.water.geometry.attributes.position;
  for(let i=0;i<pos.count;i++)pos.setZ(i,Math.sin(pos.getX(i)*1.4+T*2)*0.05+Math.cos(pos.getY(i)*1.7+T*1.6)*0.05);

  });

// moves the rat with the joystick/keys; returns speed 0..1 (2 when running). ground(x,z) gives floor height.
function control(dt,{walk=6,bounds,ground,locked=false}){
  const u=rat.userData;let dx=0,dz=0;
  if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;

  let len=Math.hypot(dx,dz);let speed=0;
  u.run=(len>0.15)&&(keys.shift||jl>0.93);
  if(locked||u.pick||(u.act&&u.act.type==='bite'))len=0;
  if(u.act&&u.act.type==='roll'){const d=u.rollDir;rat.position.x+=d.x*dt*10;rat.position.z+=d.z*dt*10;speed=0;}
  else if(len>0.15){if(len>1){dx/=len;dz/=len;len=1;}speed=u.run?1:len;const v=walk*(u.run?1.7:1)*len*(u.air?0.85:1);u.vel=v;rat.position.x+=dx*dt*v;rat.position.z+=dz*dt*v;const ty=Math.atan2(dx,dz);let d=ty-rat.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));rat.rotation.y+=d*Math.min(1,dt*14);}

  if(bounds){rat.position.x=Math.max(bounds[0],Math.min(bounds[1],rat.position.x));rat.position.z=Math.max(bounds[2],Math.min(bounds[3],rat.position.z));}
  const gy=ground?ground(rat.position.x,rat.position.z):0;

  else{ if(rat.position.y>gy+0.6){u.air=true;u.vy=0;} else rat.position.y+=(gy-rat.position.y)*Math.min(1,dt*10);}
  return speed;
}

    chip(`${f.name}<small>${cur?'current':cost}</small>`,cur?'sel':(ok?'':'used'),(!cur&&ok)?()=>{spend(f.cost);home.floor=f.id;rebuildHouse();save();renderPanel();bag();}:null);});}
  if(hs.tab==='wall'){WALLS.forEach(w=>{const cur=home.wall===w.id;const ok=cur||has(w.cost);const cost=Object.entries(w.cost).map(([k,n])=>`${n} ${ITEMS[k].name.toLowerCase()}`).join(', ')||'free';
    chip(`${w.name}<small>${cur?'current':cost}</small>`,cur?'sel':(ok?'':'used'),(!cur&&ok)?()=>{spend(w.cost);home.wall=w.id;rebuildHouse();save();renderPanel();bag();}:null);});}
  $('hplace').style.display=hs.sel?'flex':'none';$('hlist').style.display=hs.sel?'none':'flex';$('htabs').style.display=hs.sel?'none':'flex';
}
function craft(id){const c=CRAFT[id];if(!has(c.needs))return;spend(c.needs);bag();sfx.craft();
  if(c.special==='door'){home.door=true;sfx.door();rebuildHouse();ui.phase.textContent='Home';save();renderPanel();return;}
  beginPlace(id);}
// --- placing ---
function beginPlace(id){cancelPlace();const def=defOf(id);const g=def.build();g.traverse(o=>{if(o.material){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.55;}});
  hs.sel=id;hs.rot=0;hs.ghost=g;root.add(g);$('hsel').textContent=def.name;renderPanel();}
function cancelPlace(){if(!hs)return;if(hs.ghost){root.remove(hs.ghost);hs.ghost=null;}hs.sel=null;renderPanel();}
function rotateSel(){if(phase==='house'&&hs&&hs.sel)hs.rot=(hs.rot+1)%8;}
function ghostPose(){const def=defOf(hs.sel);const f=new THREE.Vector3(Math.sin(rat.rotation.y),0,Math.cos(rat.rotation.y));
  let x=rat.position.x+f.x*1.5,z=rat.position.z+f.z*1.5,y=0,rot=rat.rotation.y+hs.rot*Math.PI/4,wall=null;
  if(def.wall){ // snap to nearest wall
    const cands=[{wall:'back',d:Math.abs(z+HD/2),x,z:-HD/2+0.16,rot:0},{wall:'right',d:Math.abs(HW/2-x),x:HW/2-0.16,z,rot:-Math.PI/2},{wall:'left',d:Math.abs(x+HW/2),x:-HW/2+0.16,z,rot:Math.PI/2}];
    const c=cands.sort((a,b)=>a.d-b.d)[0];if(c.d<2.6){wall=c.wall;x=c.x;z=c.z;rot=c.rot;y=1.7;if(wall==='left'&&Math.abs(z-DOORZ)<1.2)wall='blocked';}else wall='none';}
  x=Math.max(-HW/2+0.4,Math.min(HW/2-0.4,x));z=Math.max(-HD/2+0.4,Math.min(HD/2-0.4,z));
  let ok=true;if(def.wall){ok=wall&&wall!=='none'&&wall!=='blocked';}
  else{const r=def.r||.4;hs.placed.forEach(({p,m})=>{if(p.wall)return;const pd=defOf(p.id);if(pd.flat||def.flat)return;if(Math.hypot(p.x-x,p.z-z)<r+(pd.r||.4))ok=false;});
    if(x<-HW/2+r+0.15&&Math.abs(z-DOORZ)<1.2)ok=false;}
  return {x,y,z,rot,ok,wall};}
function place(){if(!hs.sel)return;const g=ghostPose();if(!g.ok){sfx.nope();return;}sfx.place();const id=hs.sel;const def=defOf(id);
  if(!CRAFT[id]){inv[id]--;if(inv[id]<=0)delete inv[id];}
  const p={id,x:g.x,z:g.z,rot:g.rot};if(def.wall){p.wall=g.wall;p.y=g.y;}
  home.placed.push(p);spawnPlaced(p);bag();save();
  const again=!CRAFT[id]&&inv[id]>0;cancelPlace();if(again)beginPlace(id);}
function pickUp(entry){root.remove(entry.m);hs.placed=hs.placed.filter(e=>e!==entry);home.placed=home.placed.filter(p=>p!==entry.p);
  const id=entry.p.id;if(CRAFT[id]){Object.entries(CRAFT[id].needs).forEach(([k,n])=>inv[k]=(inv[k]||0)+n);}else inv[id]=(inv[id]||0)+1;bag();save();renderPanel();}
const ray2=new THREE.Raycaster(),ptr2=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{if(phase!=='house'||!hs||hs.sel)return;const rect=canvas.getBoundingClientRect();ptr2.x=((e.clientX-rect.left)/rect.width)*2-1;ptr2.y=-((e.clientY-rect.top)/rect.height)*2+1;ray2.setFromCamera(ptr2,camera);
  const hits=ray2.intersectObjects(hs.placed.map(e=>e.m),true);if(!hits.length)return;let o=hits[0].object;const entry=hs.placed.find(e=>{let ok=false;e.m.traverse(c=>{if(c===o)ok=true;});return ok;});if(entry)pickUp(entry);});
function tickHouse(dt){
  const speed=control(dt,{walk:4.5,bounds:[-HW/2+0.5,HW/2-0.5,-HD/2+0.5,HD/2-0.5]});
  // furniture blocks walking (except flat things)
  hs.placed.forEach(({p,m})=>{if(p.wall||defOf(p.id).flat)return;const r=(defOf(p.id).r||.4)+0.35;const d=Math.hypot(rat.position.x-p.x,rat.position.z-p.z);if(d<r&&d>1e-4){const k=(r-d)/d;rat.position.x+=(rat.position.x-p.x)*k;rat.position.z+=(rat.position.z-p.z)*k;}});
  rat.animate(dt,speed,false);steps(dt,speed,home.floor==='wood'?'wood':home.floor==='tiles'?'cobble':'soft');
  if(hs.ghost){const g=ghostPose();hs.ghost.position.set(g.x,g.y,g.z);hs.ghost.rotation.y=g.rot;hs.ghost.traverse(o=>{if(o.material&&o.material.color)o.material.color.set(g.ok?0xffffff:0xff5544);});
    $('hplacebtn').disabled=!g.ok;$('hplacebtn').textContent=g.ok?'Place':(g.wall==='none'?'Walk to a wall':g.wall==='blocked'?'Not over the door':'Blocked');}
  // door exit
  const nearDoor=Math.abs(rat.position.z-DOORZ)<1.1&&rat.position.x<-HW/2+1.3;
  hs.nearRadio=hs.placed.find(({p})=>p.id==='radio'&&Math.hypot(rat.position.x-p.x,rat.position.z-p.z)<1.6);
  if(hs.nearRadio&&!hs.sel){ui.prompt.style.display='block';ui.prompt.textContent=radio.on?'E · radio':'E · turn on the radio';$('padE').textContent='Radio';}
  else if(nearDoor&&!hs.sel){ui.prompt.style.display='block';ui.prompt.textContent='E · go scavenging';$('padE').textContent='Out';}else{ui.prompt.style.display='none';$('padE').textContent=hs.sel?'Place':'Grab';}
  hs.nearDoor=nearDoor;
  const portrait=innerHeight>innerWidth;const up=portrait?13:8.5,back=portrait?10.5:8;
  const cx=rat.position.x*0.5,cz=rat.position.z*0.4+back;camera.position.x+=(cx-camera.position.x)*dt*3;camera.position.z+=(cz-camera.position.z)*dt*3;camera.position.y+=(up-camera.position.y)*dt*3;
  camera.lookAt(rat.position.x*0.5,0.6,rat.position.z*0.4-1);
}
$('hplacebtn').addEventListener('click',place);$('hrot').addEventListener('click',rotateSel);$('hcancel').addEventListener('click',cancelPlace);
$('again').addEventListener('click',()=>{ui.end.style.display='none';startCutscene();});
$('start').addEventListener('click',()=>{if(load()){startHouse();ui.title.style.display='none';}else startCutscene();});
$('newgame').addEventListener('click',()=>{try{localStorage.removeItem('ww-save');}catch(e){}inv={};Object.assign(home,{floor:'wood',wall:'plaster',door:false,placed:[]});startCutscene();});
ui.skip.addEventListener('click',endCutscene);

// ---------- loop ----------
let acc=0;const STEP=1/60;
function loop(now){requestAnimationFrame(loop);let frame=Math.min(0.1,(now-last)/1000);last=now;acc+=frame;let n=0;
  try{
  while(acc>=STEP&&n<4){const dt=STEP;t+=dt;acc-=dt;n++;
    if(phase==='cutscene')tickCutscene(dt);else if(phase==='scavenge')tickScavenge(dt);else if(phase==='house')tickHouse(dt);else if(phase==='inside')tickInside(dt);else if(phase==='caught'){rat.animate(dt,1,true);if(sc.cat)sc.cat.m.animate(dt,0);}}
  if(n===4)acc=0;
  renderer.render(scene,camera);
  }catch(e){console.error(e);}}

</script>
</body>
