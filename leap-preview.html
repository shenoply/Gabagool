<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pip · Leap of Faith</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#1d2e33;color:#f4dfb5;font-family:Georgia,serif}canvas{display:block}#cap{position:fixed;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(19px,5vw,32px);text-shadow:0 2px 6px #000}small{display:block;font:11px Arial;letter-spacing:.16em;color:#e9b773;margin-bottom:7px}</style></head><body><div id="cap"><small>REAL PIP RIG · ANIMATION PREVIEW</small>Leap of faith</div><script src="three-r128-build55.js"></script><script src="GLTFLoader.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,80),renderer=new THREE.WebGLRenderer({antialias:true});scene.background=new THREE.Color(0x809da0);scene.fog=new THREE.Fog(0x809da0,10,28);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffedcb,0x3e593b,1.5));const sun=new THREE.DirectionalLight(0xffe7be,1.4);sun.position.set(5,9,5);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,42),new THREE.MeshStandardMaterial({color:0x728855,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);for(const x of [-4,4]){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(1.1,1),new THREE.MeshStandardMaterial({color:0x76503a,roughness:1}));m.position.set(x,.7,-.8);m.castShadow=true;scene.add(m)}
const runner=new THREE.Group();scene.add(runner);camera.position.set(5.8,3.5,10.5);let mixer,actions={},model;
function posedBox(root){root.updateMatrixWorld(true);const out=new THREE.Box3(),v=new THREE.Vector3();root.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.position)return;if(o.isSkinnedMesh)o.skeleton.update();const p=o.geometry.attributes.position,step=Math.max(1,Math.ceil(p.count/5000));for(let i=0;i<p.count;i+=step){v.fromBufferAttribute(p,i);if(o.isSkinnedMesh)o.boneTransform(i,v);o.localToWorld(v);out.expandByPoint(v)}});return out}
new THREE.GLTFLoader().load('rat-animation-pack67.glb',asset=>{model=asset.scene;const idle=asset.animations.find(c=>c.name==='Idle_4')||asset.animations[0];mixer=new THREE.AnimationMixer(model);mixer.clipAction(idle).play();mixer.update(0);mixer.stopAllAction();let b=posedBox(model),s=b.getSize(new THREE.Vector3());model.scale.multiplyScalar(1.7/Math.max(s.y,.01));model.updateMatrixWorld(true);b=posedBox(model);model.position.sub(new THREE.Vector3((b.min.x+b.max.x)/2,b.min.y,(b.min.z+b.max.z)/2));model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});runner.add(model);for(const c of asset.animations)actions[c.name]=mixer.clipAction(c);});
function clip(name,time){const a=actions[name];if(!a)return;for(const x of Object.values(actions))x.stop();a.reset().play();a.time=Math.min(time,a.getClip().duration-.02);mixer.update(0)}
const started=performance.now();function draw(now){requestAnimationFrame(draw);if(model){const t=((now-started)/1000)%3.2,air=t>.45&&t<1.8,q=Math.max(0,Math.min(1,(t-.45)/1.35));runner.position.set(0,air?Math.sin(q*Math.PI)*1.65:0,-1.6+t*1.0);runner.rotation.y=Math.PI;if(t<.45){clip('Idle_4',t);model.rotation.x=.28*(1-t/.45)}else if(t<1.8){clip('Regular_Jump',(t-.45)*.72);model.rotation.x=-.10}else if(t<2.45){clip('Fall_Forward',(t-1.8)*.72);model.rotation.x=.14}else{clip('Forward_Roll',(t-2.45)*1.05);model.rotation.x=0}camera.lookAt(runner.position.x,runner.position.y+.85,runner.position.z)}renderer.render(scene,camera)}requestAnimationFrame(draw);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
