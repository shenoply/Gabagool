<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pip · Assassin Leap</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#1d2e33;color:#f4dfb5;font-family:Georgia,serif}canvas{display:block}#cap{position:fixed;bottom:8%;left:0;right:0;text-align:center;font-size:clamp(19px,5vw,32px);text-shadow:0 2px 6px #000;pointer-events:none}small{display:block;font:11px Arial;letter-spacing:.16em;color:#e9b773;margin-bottom:7px}#zoom{position:fixed;top:18px;right:16px;display:grid;gap:7px}button{border:1px solid #f4dfb577;border-radius:12px;background:#243b3ee8;color:#f4dfb5;padding:10px 13px;font:600 14px Arial}</style></head><body><div id="cap"><small>REAL PIP RIG · HIGH LEDGE TO HAY</small>Assassin leap of faith</div><div id="zoom"><button id="out">− Zoom out</button><button id="in">+ Zoom in</button></div><script src="three-r128-build55.js"></script><script src="GLTFLoader.js"></script><script>
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.05,80),renderer=new THREE.WebGLRenderer({antialias:true});scene.background=new THREE.Color(0x809da0);scene.fog=new THREE.Fog(0x809da0,10,28);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffedcb,0x3e593b,1.5));const sun=new THREE.DirectionalLight(0xffe7be,1.4);sun.position.set(5,9,5);sun.castShadow=true;scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,42),new THREE.MeshStandardMaterial({color:0x728855,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ledge=new THREE.Mesh(new THREE.BoxGeometry(4,.45,2),new THREE.MeshStandardMaterial({color:0x705447,roughness:1}));ledge.position.set(0,3.0,-1.65);ledge.castShadow=ledge.receiveShadow=true;scene.add(ledge);const hayMat=new THREE.MeshStandardMaterial({color:0xc89d48,roughness:1});for(const [x,y,z,r]of [[0,.25,.8,1.2],[-.65,.35,.72,.9],[.65,.35,.88,.9],[0,.55,.75,.9]]){const bale=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.42,10),hayMat);bale.rotation.z=Math.PI/2;bale.position.set(x,y,z);bale.castShadow=true;scene.add(bale)}
const runner=new THREE.Group();scene.add(runner);camera.position.set(6.4,4.2,10.8);let mixer,actions={},model,bones={},rest={},zoom=1;
function posedBox(root){root.updateMatrixWorld(true);const out=new THREE.Box3(),v=new THREE.Vector3();root.traverse(o=>{if(!o.isMesh||!o.geometry?.attributes?.position)return;if(o.isSkinnedMesh)o.skeleton.update();const p=o.geometry.attributes.position,step=Math.max(1,Math.ceil(p.count/5000));for(let i=0;i<p.count;i+=step){v.fromBufferAttribute(p,i);if(o.isSkinnedMesh)o.boneTransform(i,v);o.localToWorld(v);out.expandByPoint(v)}});return out}
new THREE.GLTFLoader().load('rat-animation-pack67.glb',asset=>{model=asset.scene;const idle=asset.animations.find(c=>c.name==='Idle_4')||asset.animations[0];mixer=new THREE.AnimationMixer(model);mixer.clipAction(idle).play();mixer.update(0);mixer.stopAllAction();let b=posedBox(model),s=b.getSize(new THREE.Vector3());model.scale.multiplyScalar(1.7/Math.max(s.y,.01));model.updateMatrixWorld(true);b=posedBox(model);model.position.sub(new THREE.Vector3((b.min.x+b.max.x)/2,b.min.y,(b.min.z+b.max.z)/2));model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}if(o.isBone){bones[o.name]=o;rest[o.name]=o.quaternion.clone()}});runner.add(model);for(const c of asset.animations)actions[c.name]=mixer.clipAction(c);});
function clip(name,time){const a=actions[name];if(!a)return;for(const x of Object.values(actions))x.stop();a.reset().play();a.time=Math.min(time,a.getClip().duration-.02);mixer.update(0)}
function divePose(q){const turn=(name,x,y=0,z=0)=>{const b=bones[name],r=rest[name];if(b&&r)b.quaternion.copy(r).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)))};turn('Spine',-.35);turn('Spine01',-.22);turn('Head',.18);turn('LeftArm',-1.48,0,-1.16);turn('RightArm',-1.48,0,1.16);turn('LeftForeArm',-.45,0,-.22);turn('RightForeArm',-.45,0,.22);turn('LeftUpLeg',.18,0,-.08);turn('RightUpLeg',.18,0,.08);turn('LeftLeg',-.12);turn('RightLeg',-.12)}
const started=performance.now();function draw(now){requestAnimationFrame(draw);if(model){const t=((now-started)/1000)%3.4,q=Math.max(0,Math.min(1,(t-.42)/1.72));if(t<.42){runner.position.set(0,3.27,-1.65);runner.rotation.set(0,Math.PI,0);clip('Idle_4',t)}else if(t<2.14){runner.position.set(0,3.27*(1-q)*(1-q),-1.65+2.45*q);runner.rotation.set(-1.48*q,Math.PI,0);clip('Fall_Forward',q*.9);divePose(q)}else{runner.position.set(0,.04,.80);runner.rotation.set(-1.48,Math.PI,0);clip('Fall_Forward',.88);divePose(1)}const look=new THREE.Vector3(0,1.55,-.15);camera.position.lerp(new THREE.Vector3(6.4*zoom,4.2*zoom,10.8*zoom),.12);camera.lookAt(look)}renderer.render(scene,camera)}requestAnimationFrame(draw);document.getElementById('out').onclick=()=>zoom=Math.min(2.8,zoom+.25);document.getElementById('in').onclick=()=>zoom=Math.max(.7,zoom-.25);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
