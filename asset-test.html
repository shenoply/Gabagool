<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#111}#badge{position:fixed;left:8px;bottom:4px;z-index:99;color:#fff8;font:10px Arial;pointer-events:none}</style></head><body><iframe id="game" src="index.html?v=543a477b"></iframe><div id="badge">ASSET TEST</div><script>const f=document.getElementById('game');f.onload=()=>{const s=f.contentDocument.createElement('script');s.textContent=`(()=>{if(window.__assetTest)return;window.__assetTest=1;const G=new THREE.Group();G.name='AssetGameplayTest';scene.add(G);const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const box=(x,y,z,c)=>new THREE.Mesh(new THREE.BoxGeometry(x,y,z),mat(c));const sph=(r,c)=>new THREE.Mesh(new THREE.SphereGeometry(r,10,7),mat(c));function gecko(){let g=new THREE.Group(),b=box(1.35,.28,.48,0x668a45);g.add(b);let h=sph(.28,0x789d50);h.position.x=.78;g.add(h);for(let i=-1;i<=1;i+=2)for(let j=-1;j<=1;j+=2){let l=box(.5,.08,.09,0x526f39);l.position.set(i*.35,-.08,j*.34);l.rotation.y=j*.55;g.add(l)}let t=box(1.05,.12,.15,0x526f39);t.position.x=-1.05;g.add(t);g.position.set(12,.45,9);g.userData={tamed:false,phase:0};G.add(g);return g}function snake(){let g=new THREE.Group();for(let i=0;i<10;i++){let q=sph(.18-i*.006,0x6b7650);q.position.set(i*.28,0,Math.sin(i*.75)*.22);g.add(q)}g.position.set(20,.25,-7);g.userData={phase:Math.random()*6,state:'idle'};G.add(g);return g}function ant(x,z){let g=new THREE.Group();for(let i=0;i<3;i++){let q=sph(.07,0x2c1b12);q.position.x=i*.12;g.add(q)}let crumb=sph(.06,0xd6ad68);crumb.position.set(.3,.12,0);g.add(crumb);g.position.set(x,.12,z);G.add(g);return g}const gg=gecko(),ss=snake(),ants=Array.from({length:12},(_,i)=>ant(-8+i*.45,14+Math.sin(i)*.3));for(const [x,z] of [[-18,12],[-14,17],[18,13],[22,8]]){let bush=new THREE.Group();for(let k=0;k<5;k++){let q=sph(.45+Math.random()*.25,0x48663d);q.position.set((Math.random()-.5)*.8,.35+Math.random()*.35,(Math.random()-.5)*.8);bush.add(q)}bush.position.set(x,0,z);G.add(bush)}let hydr=box(.35,.9,.35,0x9a3c2c);hydr.position.set(-20,.45,-10);G.add(hydr);let bin=box(1.1,1.2,.8,0x465750);bin.position.set(18,.6,15);G.add(bin);let bench=new THREE.Group(),seat=box(2.2,.16,.55,0x72503b);seat.position.y=.7;bench.add(seat);for(let x of [-.8,.8]){let l=box(.12,.7,.12,0x3e4140);l.position.set(x,.35,0);bench.add(l)}bench.position.set(-15,0,-8);G.add(bench);let npc=new THREE.Group(),nb=box(.9,.42,.45,0x77706a);npc.add(nb);let nh=sph(.3,0x817a72);nh.position.x=.58;npc.add(nh);npc.position.set(7,.35,-14);G.add(npc);const ui=document.createElement('button');ui.textContent='Tame gecko';Object.assign(ui.style,{position:'fixed',right:'12px',bottom:'185px',zIndex:90,padding:'10px 14px',borderRadius:'18px',border:'0',background:'#d9a441',display:'none'});document.body.appendChild(ui);ui.onclick=()=>{gg.userData.tamed=true;ui.textContent='Ride gecko'};let last=performance.now();function tick(n){let dt=Math.min(.04,(n-last)/1000);last=n;gg.userData.phase+=dt;ss.userData.phase+=dt;const p=gg.userData.phase;gg.position.y=.42+Math.sin(p*4)*.025;if(gg.userData.tamed){gg.position.x+=Math.sin(p*.55)*dt*.35;gg.rotation.y=Math.sin(p*.35)*.5}let d=rat&&rat.position?rat.position.distanceTo(gg.position):99;ui.style.display=d<4?'block':'none';ants.forEach((a,i)=>{a.position.x=-8+((p*.65+i*.6)%8);a.position.z=14+Math.sin(a.position.x*1.5+i)*.35;a.rotation.y=Math.sin(p+i)*.2});let sd=rat&&rat.position?rat.position.distanceTo(ss.position):99;if(sd<4){ss.userData.state='warning';ss.rotation.z=Math.sin(p*8)*.08}else ss.userData.state='idle';npc.rotation.y=Math.sin(p*.45)*.3;requestAnimationFrame(tick)}requestAnimationFrame(tick);})();`;f.contentDocument.body.appendChild(s)}};</script></body></html>
