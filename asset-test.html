<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#111}#status{position:fixed;left:8px;top:8px;z-index:999;background:#142b28;color:#ffe3a8;padding:8px 10px;border-radius:9px;font:12px Arial;pointer-events:none}</style></head><body><iframe id="game" src="index.html?v=543a477b"></iframe><div id="status">ASSET TEST · waiting for game…</div><script>const f=document.getElementById('game'),status=document.getElementById('status');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;let tries=0;const wait=setInterval(()=>{tries++;if(w.THREE&&w.scene&&w.rat){clearInterval(wait);install(w,d)}else if(tries>300){clearInterval(wait);status.textContent='ASSET TEST · game globals not available'}},100)};function install(w,d){status.textContent='ASSET TEST · additions loaded beside Pip';const T=w.THREE,G=new T.Group();G.name='AssetShowcase';w.scene.add(G);const M=c=>new T.MeshStandardMaterial({color:c,roughness:.8}),box=(a,b,c,col)=>new T.Mesh(new T.BoxGeometry(a,b,c),M(col)),sph=(r,col)=>new T.Mesh(new T.SphereGeometry(r,12,8),M(col));const base=w.rat.position.clone();function label(text,obj,y=1.5){let cv=d.createElement('canvas');cv.width=256;cv.height=64;let x=cv.getContext('2d');x.fillStyle='#172b29dd';x.fillRect(0,0,256,64);x.fillStyle='#ffe0a0';x.font='bold 25px Arial';x.textAlign='center';x.fillText(text,128,40);let tx=new T.CanvasTexture(cv),sp=new T.Sprite(new T.SpriteMaterial({map:tx,depthTest:false}));sp.scale.set(3.2,.8,1);sp.position.y=y;obj.add(sp)}function gecko(){let g=new T.Group(),b=box(1.4,.32,.55,0x5f8b43);g.add(b);let h=sph(.3,0x7aa052);h.position.x=.82;g.add(h);let tail=box(1.2,.14,.16,0x52753c);tail.position.x=-1.15;g.add(tail);for(let sx of [-1,1])for(let sz of [-1,1]){let q=box(.55,.09,.1,0x486b36);q.position.set(sx*.35,-.1,sz*.38);q.rotation.y=sz*.6;g.add(q)}g.position.copy(base).add(new T.Vector3(3,.5,-1));label('GECKO · TAME',g);G.add(g);return g}function snake(){let g=new T.Group();for(let i=0;i<12;i++){let q=sph(.2-i*.007,0x66764b);q.position.set(i*.25,0,Math.sin(i*.8)*.24);g.add(q)}g.position.copy(base).add(new T.Vector3(-3,.3,-1));label('SNAKE',g,1.2);G.add(g);return g}function ant(i){let g=new T.Group();for(let k=0;k<3;k++){let q=sph(.075,0x28180f);q.position.x=k*.13;g.add(q)}let cr=sph(.07,0xd8b46d);cr.position.set(.34,.14,0);g.add(cr);g.position.copy(base).add(new T.Vector3(-2+i*.35,.15,2.6));G.add(g);return g}function npc(){let g=new T.Group(),b=box(1,.45,.5,0x756d68);g.add(b);let h=sph(.32,0x817974);h.position.x=.62;g.add(h);let t=box(1.1,.12,.14,0x665f5b);t.position.x=-1;g.add(t);g.position.copy(base).add(new T.Vector3(1,.4,4));label('NEW RAT NPC',g);G.add(g);return g}const gg=gecko(),ss=snake(),aa=Array.from({length:10},(_,i)=>ant(i)),nn=npc();let hydr=box(.4,1,.4,0xa64032);hydr.position.copy(base).add(new T.Vector3(5,.5,3));label('HYDRANT',hydr,1.1);G.add(hydr);let bin=box(1.2,1.3,.85,0x435851);bin.position.copy(base).add(new T.Vector3(-5,.65,3));label('BIN',bin,1.25);G.add(bin);for(let i=0;i<4;i++){let bush=new T.Group();for(let k=0;k<5;k++){let q=sph(.4+Math.random()*.2,0x496c3d);q.position.set((Math.random()-.5)*.8,.35+Math.random()*.35,(Math.random()-.5)*.8);bush.add(q)}bush.position.copy(base).add(new T.Vector3(-5+i*3.3,0,6));G.add(bush)}const btn=d.createElement('button');btn.textContent='TAME GECKO';Object.assign(btn.style,{position:'fixed',right:'10px',bottom:'190px',zIndex:999,padding:'12px 15px',border:'0',borderRadius:'20px',background:'#d9a441',font:'bold 12px Arial'});d.body.appendChild(btn);let tame=false;btn.onclick=()=>{tame=!tame;btn.textContent=tame?'GECKO TAMED ✓':'TAME GECKO'};let p=0,last=performance.now();function tick(n){let dt=Math.min(.04,(n-last)/1000);last=n;p+=dt;gg.position.y=base.y+.5+Math.sin(p*5)*.035;gg.rotation.y=Math.sin(p*.7)*.18;ss.rotation.z=Math.sin(p*6)*.08;aa.forEach((a,i)=>{a.position.x=base.x-2+((p*.7+i*.35)%4);a.position.z=base.z+2.6+Math.sin(p*2+i)*.18});nn.rotation.y=Math.sin(p*.6)*.25;requestAnimationFrame(tick)}requestAnimationFrame(tick)}};</script></body></html>
