<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Wet Whiskers — Constrained Gecko Ride</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#090d0b}
    iframe{display:block}
    #tag{position:fixed;z-index:9;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:999px;background:#173b2bcc;color:#fff;font:700 11px system-ui;letter-spacing:.04em;pointer-events:none}
  </style>
</head>
<body>
  <div id="tag">CONSTRAINED GECKO LEGS · 113</div>
  <iframe id="game" title="Wet Whiskers game" src="index.html?base=346a5ecc-gecko113"></iframe>
  <script>
    document.getElementById('game').addEventListener('load', function () {
      const doc = this.contentDocument;
      const files = [
        'wildlife-safe.js?v=113',
        'wildlife-cinematic96.js?v=113',
        'wildlife-align97.js?v=113',
        'wildlife-level113.js?v=113'
      ];
      const load = i => {
        if (i >= files.length) return;
        const script = doc.createElement('script');
        script.src = files[i];
        script.onload = () => load(i + 1);
        doc.body.appendChild(script);
      };
      load(0);
    });
  </script>
</body>
</html>
